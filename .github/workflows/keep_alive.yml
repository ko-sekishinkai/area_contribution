name: Streamlit Ultra Keep Alive

on:
  schedule:
    # 【案A】1時間に1回アクセス（スリープ判定を回避）
    - cron: '0 * * * *'
    # 【案B】週に1回、深夜に「擬似的な更新」を発生させる
    - cron: '0 3 * * 1'
  workflow_dispatch: # 手動実行用

jobs:
  ping_and_refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 更新を書き込むために必要
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Send HTTP Request (Ping)
        run: |
          curl -I -s https://areacontribution-xygglsrpjvg7qkv4dmbpic.streamlit.app/

      - name: Auto Update (Keep Active)
        # 月曜日の午前3時の実行時のみ、ファイルを微修正してCommitする
        if: github.event.schedule == '0 3 * * 1'
        run: |
          date > last_keep_alive.txt
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add last_keep_alive.txt
          git commit -m "Keep-alive: Periodic activity update"
          git push
